 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ERP Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #475569;
            text-align: left;
        }
        th { background: #2563eb; }
        a { color: #60a5fa; }
    </style>
</head>
<body>
    <h1>ERP Management System</h1>
    <h2>Inventory Dashboard</h2>
    <p><a href="/admin/">Admin Panel</a></p>
    <table>
        <tr>
            <th>SKU</th>
            <th>Product</th>
            <th>Stock</th>
        </tr>
        {% for product, stock in rows %}
        <tr>
            <td>{{ product.sku }}</td>
            <td>{{ product.name }}</td>
            <td>{{ stock }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No products available</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
